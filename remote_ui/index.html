<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>CareerPilot Remote</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>CareerPilot</h1>
      <p class="sub">Phone remote · runs on your PC/VPS · never auto-applies</p>
    </header>

    <section id="login" class="card">
      <label for="server">CareerPilot server URL</label>
      <input id="server" type="url" autocomplete="off" placeholder="http://192.168.1.10:8000" />
      <p id="server-hint" class="msg" style="color: var(--muted)"></p>
      <label for="token">Remote API token</label>
      <input id="token" type="password" autocomplete="off" placeholder="REMOTE_API_TOKEN from .env" />
      <button id="btn-save" type="button">Save &amp; connect</button>
      <p id="login-msg" class="msg"></p>
    </section>

    <section id="app" class="hidden">
      <div class="card status" id="status-box">
        <p>Loading status…</p>
      </div>

      <div class="actions">
        <button id="btn-run" type="button" class="primary">Run pipeline</button>
        <button id="btn-refresh" type="button">Refresh status</button>
        <button id="btn-digests" type="button">Latest digests</button>
      </div>

      <div class="card">
        <h2>Daily scan</h2>
        <label class="row">
          <input id="toggle-scan" type="checkbox" />
          Enable morning auto-scan
        </label>
        <button id="btn-scan" type="button">Apply scan toggle</button>
      </div>

      <div class="card">
        <h2>Notify on manual run</h2>
        <label class="row">
          <input id="toggle-notify" type="checkbox" />
          Send digest after phone-triggered runs (uses profile setting)
        </label>
        <button id="btn-notify" type="button">Save notify preference</button>
      </div>

      <div class="card">
        <h2>Activity</h2>
        <pre id="log" class="log"></pre>
      </div>

      <button id="btn-logout" type="button" class="ghost">Clear token</button>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
